spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/rsdp?currentSchema=public
    username: ${DB_USERNAME:your-username}
    password: ${DB_PASSWORD:your-password}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      enabled: false

rsdp:
  encryption:
    key: ${RSDP_ENCRYPTION_KEY}

  ai:
    api-key: ${DASHSCOPE_API_KEY}
    # 本机无真实 DashScope Key 时可启用 AI Mock，避免外部 AI 调用失败。
    mock:
      enabled: ${RSDP_AI_MOCK_ENABLED:false}

  jwt:
    secret: ${RSDP_JWT_SECRET}
    # 本地开发使用 HTTP，必须关闭 Secure 属性，否则浏览器拒绝存储 Cookie
    # SameSite=Lax 允许跨端口（5173 → 8081）携带 Cookie
    cookie-secure: false
    cookie-same-site: Lax

  order:
    invite-secret: ${RSDP_ORDER_INVITE_SECRET}

  import:
    # 开发/测试环境可放开本地图片地址；生产环境应留空，仅允许公网地址
    allowed-image-hosts: 127.0.0.1,localhost

# 开发环境文件先存本地磁盘
# 默认使用相对路径；若从项目根目录启动，建议通过 RSDP_STORAGE_LOCAL_PATH
# 环境变量指定为 <项目根目录>/server/data/uploads 的绝对路径，避免启动目录变化导致找不到已上传图片。
storage:
  type: local
  local-path: ${RSDP_STORAGE_LOCAL_PATH:./data/uploads}
