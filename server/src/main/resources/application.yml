spring:
  application:
    name: rsdp-server
  profiles:
    # IntelliJ's class-level green button may create a transient run
    # configuration without active profiles. Use dev for that local path;
    # explicit SPRING_PROFILES_ACTIVE=prod still overrides this in Docker.
    default: dev
  config:
    # Local IDE runs do not automatically read deploy/.env. Import it here so
    # green-button runs and scripts share the same local secret source.
    import:
      - optional:file:deploy/.env[.properties]
      - optional:file:../deploy/.env[.properties]
  datasource:
    hikari:
      # 连接池大小：本地部署推荐 (CPU 核数 * 2) + 有效磁盘数，典型值 10~20
      maximum-pool-size: ${RSDP_HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${RSDP_HIKARI_MIN_IDLE:5}
      connection-timeout: ${RSDP_HIKARI_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${RSDP_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${RSDP_HIKARI_MAX_LIFETIME:1200000}
      leak-detection-threshold: ${RSDP_HIKARI_LEAK_DETECTION_THRESHOLD:60000}
      pool-name: RSDP-HikariCP
  flyway:
    # 结构版本治理：Flyway 为唯一迁移状态源（V 脚本不可变，变更只能新增版本）。
    # 仅承载结构演进（纯 SQL）；数据修正任务由 DatabaseMigrationRunner 调度，不在此列。
    locations: classpath:db/migration
    # 存量环境（已有业务表、无迁移历史）首次启动时自动以 V1 为基线，不重复执行基线脚本
    baseline-on-migrate: true
    baseline-version: 1
    # 启动时校验迁移脚本 checksum 与顺序，被篡改或缺失时阻断启动
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    # JSON 时间渲染时区（TIMESTAMPTZ 列统一按 Asia/Shanghai 输出，与 JVM/DB 会话时区一致）
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force-request-encoding: true
      force-response-encoding: true

storage:
  type: local
  local-path: ./data/uploads

mybatis-plus:
  # 注册 TypeHandler 包路径，确保 @TableField(typeHandler) 和价格加密处理器生效
  type-handlers-package: com.rsdp.config.typehandler

rsdp:
  ai:
    # 通义千问 VL 兼容 OpenAI 格式
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3-vl-plus
    api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
    timeout-seconds: 60
    max-retries: 2
    # 异步 AI 识别允许的最大图片字节数（默认 20MB）
    max-image-size: 20971520
    # Mock 模式：开启后 AI 识别返回固定模拟结果，仅用于本地无密钥联调
    mock:
      enabled: false
    # 主图智能裁剪：录入时 AI 识别产品主体并裁剪为主图，失败自动回退原图
    subject-crop:
      enabled: true
      # 裁剪成功后是否将原图另存为 original 类型图片资产（可追溯/可恢复）
      keep-original: true
      # bbox 面积占全图比例下限，低于则视为误检不裁剪（0.02：整页型录截图中完整产品可能只占几个百分点）
      min-area-ratio: 0.02
      # bbox 面积占全图比例上限，高于则说明图已是纯产品图不裁剪（0.98：收窄组合图漏裁窗口）
      max-area-ratio: 0.98
      # 裁剪后再做一次 AI 完整性校验，不完整时加大框重裁或回退原图
      verify-crop: true
    # 多模态 embedding 模型，用于以图搜图
    embedding-model: multimodal-embedding-v1
    embedding-base-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding
    embedding-timeout-seconds: 30
    embedding-max-retries: 2
  # 重复导入检测
  dedup:
    # 同款检测：向量相似度阈值（0~1），录入新品与库内产品相似度超过该值时标记"存疑-疑似同款"
    similar-threshold: 0.95
  # 户型图分析（户型图 → 空间尺寸 → 产品搭配 链路）
  floor-plan:
    detect-image-max-edge: 2688
    max-file-size-mb: 10
    pdf-render-dpi: 200           # PDF 户型图首页渲染 DPI（P2，与 PDF 导入链路既有默认一致）
    rules:                        # 尺寸硬规则，可运维调整（P0-B 规则引擎消费）
      sofa-wall-ratio: 0.75       # 沙发长度 ≤ 沙发墙 × 0.75
      sofa-tea-min-mm: 350        # 沙发→茶几最小通道
      sofa-tea-max-mm: 450
      walkway-min-mm: 600         # 茶几→电视柜最小过人通道
      tv-cabinet-wall-ratio: 0.8
      small-living-area-m2: 12    # 小客厅分界
      small-living-sofa-max-mm: 2200
      large-living-area-m2: 20
  rate-limit:
    # 公开免登录接口 IP 限流（PublicRateLimitFilter）：防脚本刷付费 AI 额度/灌留资表
    enabled: ${RSDP_RATE_LIMIT_ENABLED:true}
    ai-match-permits: ${RSDP_RATE_LIMIT_AI_MATCH:10}   # AI 户型搭配 每 IP 每窗口次数
    leads-permits: ${RSDP_RATE_LIMIT_LEADS:5}          # 留资提交 每 IP 每窗口次数
    window-seconds: ${RSDP_RATE_LIMIT_WINDOW_SECONDS:60}
    timeout-seconds: 10
    max-retries: 2
  encryption:
    # Base64 编码的 32 字节 AES-256 密钥，生产环境必须通过 RSDP_ENCRYPTION_KEY 注入
    key: ${RSDP_ENCRYPTION_KEY:}
  data-fix:
    # 启动期数据修正任务批次大小（DatabaseMigrationRunner 调度，幂等；见 com.rsdp.migration）
    encrypt-batch-size: 100
    price-summary-batch-size: 100
    six-dim-batch-size: 200
  async:
    core-pool-size: 4
    max-pool-size: 16
    queue-capacity: 200
    thread-name-prefix: rsdp-async-
    # 线程池队列满时的拒绝策略：abort（默认，抛异常）/ discard / discard-oldest / caller-runs
    rejected-policy: abort
  jwt:
    # JWT 签名密钥，Base64 编码，长度至少 256 位（32 字节）
    # 必须通过环境变量 RSDP_JWT_SECRET 注入，切勿在配置中硬编码
    secret: ${RSDP_JWT_SECRET}
    # token 有效期，单位小时
    expiration-hours: 24
    # HttpOnly Cookie 配置
    cookie-name: ${RSDP_JWT_COOKIE_NAME:rsdp_token}
    # Secure 属性：生产环境必须 true，开发环境若使用 http 可设为 false
    cookie-secure: ${RSDP_JWT_COOKIE_SECURE:true}
    cookie-same-site: ${RSDP_JWT_COOKIE_SAME_SITE:Strict}
  security:
    # 允许跨域来源，逗号分隔；生产环境必须通过 RSDP_ALLOWED_ORIGINS 配置为具体域名白名单
    allowed-origins: ${RSDP_ALLOWED_ORIGINS:http://localhost:5173}
    # 登录防爆破保护
    login:
      # 允许的最大失败次数，超过则锁定
      max-attempts: ${RSDP_LOGIN_MAX_ATTEMPTS:5}
      # 锁定时长（分钟）
      lock-duration-minutes: ${RSDP_LOGIN_LOCK_DURATION_MINUTES:15}
      # 失败计数窗口（分钟）
      attempt-window-minutes: ${RSDP_LOGIN_ATTEMPT_WINDOW_MINUTES:30}
      # 可信反向代理层数；默认 0 表示不信任 X-Forwarded-For，直接使用 remoteAddr
      trusted-proxy-count: ${RSDP_LOGIN_TRUSTED_PROXY_COUNT:0}
  order:
    # 订单客户邀请链接 HMAC 密钥，长度 >= 32 位；生产环境必须通过 RSDP_ORDER_INVITE_SECRET 注入
    invite-secret: ${RSDP_ORDER_INVITE_SECRET:}
    # 邀请链接有效期（天）
    invite-expire-days: ${RSDP_ORDER_INVITE_EXPIRE_DAYS:7}
  import:
    # 产品批量导入时允许下载图片的 host 白名单，逗号分隔；留空表示仅允许公网地址
    allowed-image-hosts: ${RSDP_IMPORT_ALLOWED_IMAGE_HOSTS:}
  document-import:
    pdf:
      # PDF 导入文件大小上限（MB）
      max-file-size-mb: 50
      # PDF 最大页数（默认 50：同步全页位图渲染驻留堆内存，页数过多有 OOM 风险，异步化后再评估上调）
      max-pages: 50
      # 渲染 DPI（越高裁剪图越清晰，内存占用随平方增长）
      render-dpi: 200
      # 页面区域检测每批最大页数
      # 注意：AI 对长 JSON 输出有截断风险，MVP 阶段建议保持 <=5，确保每批返回结果完整
      detect-batch-size: 5
      # 裁剪输出图片格式
      output-format: jpg
      # 裁剪输出图片质量（1-100，仅对 jpg 有效）
      output-quality: 90
      # 嵌入图直取：图片绘制面积占页面面积的最小比例（低于该值视为 Logo/装饰图）
      embedded-image:
        min-area-ratio: 0.20
        # 嵌入图原始像素最小边长（过滤缩略图）
        min-pixel-edge: 200
