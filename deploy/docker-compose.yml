version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rsdp-postgres
    # 生产环境建议移除宿主机端口映射；本地开发需要连接 127.0.0.1:5432
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: rsdp
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 容器/数据库默认时区：timestamptz 的默认渲染基准（须与后端 JVM 的 TZ 一致，勿随意改）
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 首次启动自动初始化：PG initdb 按字母序执行目录顶层 *.sql
      # schema/ = 基线 DDL（01_~12_ 数字编号按序 + cross_domain_fk.sql 字母序排最后）
      # + zz_seed.sql（必需字典/权限种子，zz 前缀保证最后执行），单一目录挂载
      - ../database/schema:/docker-entrypoint-initdb.d

  ollama:
    image: ollama/ollama:0.5.11
    container_name: rsdp-ollama
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Windows 无 GPU 时删除 deploy.resources 部分

  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: rsdp-chromadb
    # 生产环境建议移除宿主机端口映射；本地开发后端通过 localhost:8000 访问
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SERVER_AUTHN_PROVIDER=${CHROMA_AUTH_PROVIDER:-}
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMA_AUTH_CREDENTIALS:-}

  redis:
    image: redis:7-alpine
    container_name: rsdp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: rsdp-minio
    # 仅通过内部网络暴露，不映射宿主机端口
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: rsdp-server
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=rsdp
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - OLLAMA_URL=http://ollama:11434
      - CHROMADB_URL=http://chromadb:8000
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - CHROMADB_AUTH_TOKEN=${CHROMA_AUTH_CREDENTIALS:-}
      - RSDP_ENCRYPTION_KEY=${RSDP_ENCRYPTION_KEY}
      - RSDP_JWT_SECRET=${RSDP_JWT_SECRET}
      - RSDP_JWT_COOKIE_SECURE=${RSDP_JWT_COOKIE_SECURE:-true}
      - RSDP_ORDER_INVITE_SECRET=${RSDP_ORDER_INVITE_SECRET}
      - RSDP_ORDER_INVITE_EXPIRE_DAYS=${RSDP_ORDER_INVITE_EXPIRE_DAYS:-7}
      - RSDP_ALLOWED_ORIGINS=${RSDP_ALLOWED_ORIGINS}
      - RSDP_IMPORT_ALLOWED_IMAGE_HOSTS=${RSDP_IMPORT_ALLOWED_IMAGE_HOSTS:-}
    depends_on:
      - postgres
      - ollama
      - chromadb
      - redis
      - minio
    volumes:
      - server-data:/data

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: rsdp-web
    expose:
      - "80"
    depends_on:
      - server

  # 注意：nginx.conf 强制 HTTPS，启动前必须先生成证书：
  #   scripts/gen-dev-cert.sh        （开发自签名）
  # 或将正式 CA 证书放置为 deploy/nginx/ssl/server.crt 与 server.key
  nginx:
    image: nginx:1.27-alpine
    container_name: rsdp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
      - web

volumes:
  postgres-data:
  ollama-models:
  chroma-data:
  redis-data:
  minio-data:
  server-data:
