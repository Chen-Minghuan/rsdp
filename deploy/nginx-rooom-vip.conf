# rooom.vip 站点模板：RSDP 管理端接管根路径与 /api/（2026-11-13）
# 实际路径 /etc/nginx/sites-available/rooom.vip（sites-enabled 软链）。
# 变更范围：仅根路径 location / 与 /api/ 代理；/office、/assess 段原样保留。
# 切换前备份现有文件到 /opt/rsdp/backups/nginx-rooom.vip-<日期>-pre-rsdp。
#
# 后端容器回环 127.0.0.1:3100（server），前端容器回环 127.0.0.1:3101（web）。
# 长请求超时 300s、上传 200m；Agent SSE（/api/v1/agent/）关闭响应缓冲。

server {
    listen 80;
    server_name rooom.vip www.rooom.vip;

    # RSDP 管理端强制 HTTPS（会话 Cookie 为 Secure，HTTP 下无法登录）
    location / {
        return 301 https://$host$request_uri;
    }

    location /api/ {
        return 301 https://$host$request_uri;
    }

    # ---- 以下为既有规则，保持不变 ----

    # Intern assessment app (docker compose project "app", loopback 127.0.0.1:3000,
    # frontend built with base /assess/; prefix stripped before proxying).
    location = /assess {
        return 301 /assess/;
    }

    location /assess/api/ {
        rewrite ^/assess(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assess/ {
        rewrite ^/assess(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # rsdp-office 子路径入口（frontend-office 容器，回环 127.0.0.1:3002）
    location = /office {
        return 301 /office/;
    }

    location = /office/login/ {
        return 302 /office/login$is_args$args;
    }

    location = /office/login {
        proxy_pass http://127.0.0.1:3002/index.html;
        proxy_set_header Host $http_host;
    }

    location /office/ {
        rewrite ^/office(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /office;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 150m;
        proxy_redirect ~^/((?!office/).*)$ /office/$1;

        # HTTP 不能使用 Secure 会话 Cookie，仅在 80 端口移除 Secure 标记
        proxy_cookie_flags RSDP_SESSION nosecure;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rooom.vip www.rooom.vip;

    ssl_certificate     /etc/nginx/ssl/rooom.vip.pem;
    ssl_certificate_key /etc/nginx/ssl/rooom.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # RSDP 管理端前端（Vue SPA，web 容器）
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 200m;
    }

    # Agent SSE 流式接口：关闭响应缓冲与缓存，长连接
    location /api/v1/agent/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        client_max_body_size 200m;
    }

    # RSDP 后端 API（Spring Boot，server 容器）
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 200m;
    }

    # ---- 以下为既有规则，保持不变 ----

    location = /assess {
        return 301 /assess/;
    }

    location /assess/api/ {
        rewrite ^/assess(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assess/ {
        rewrite ^/assess(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /office {
        return 301 /office/;
    }

    location = /office/login/ {
        return 302 /office/login$is_args$args;
    }

    location = /office/login {
        proxy_pass http://127.0.0.1:3002/index.html;
        proxy_set_header Host $http_host;
    }

    location /office/ {
        rewrite ^/office(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /office;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 150m;
        proxy_redirect ~^/((?!office/).*)$ /office/$1;
    }
}
