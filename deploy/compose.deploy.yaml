# RSDP 主项目生产 Compose（独立于 deploy/docker-compose.yml 的开发编排）
# 项目名 rsdp，数据持久化在 ${RSDP_DATA_DIR:-/opt/rsdp/data}，与 rsdp-office 完全隔离。
# AI 推理使用 DashScope，Ollama 不在默认启动依赖内。
name: rsdp

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rsdp
      POSTGRES_USER: ${POSTGRES_USER:-rsdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env}
      TZ: Asia/Shanghai
    volumes:
      - ${RSDP_DATA_DIR:-/opt/rsdp/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d rsdp']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the server .env}
    volumes:
      - ${RSDP_DATA_DIR:-/opt/rsdp/data}/redis:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the server .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the server .env}
    volumes:
      - ${RSDP_DATA_DIR:-/opt/rsdp/data}/minio:/data
    command: server /data

  cad-parser:
    build:
      context: ../rsdp-cad-parser
    image: rsdp-cad-parser:${IMAGE_TAG:-local}
    restart: unless-stopped
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8090']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  server:
    build:
      context: ../server
    image: rsdp-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RSDP_SERVER_PORT:-3100}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rsdp
      DB_USERNAME: ${POSTGRES_USER:-rsdp}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      # prod profile 未显式配置 spring.data.redis.password，依赖该环境变量经 relaxed binding 注入
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-rsdp}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in the server .env}
      RSDP_ENCRYPTION_KEY: ${RSDP_ENCRYPTION_KEY:?Set RSDP_ENCRYPTION_KEY in the server .env}
      RSDP_JWT_SECRET: ${RSDP_JWT_SECRET:?Set RSDP_JWT_SECRET in the server .env}
      RSDP_JWT_COOKIE_SECURE: ${RSDP_JWT_COOKIE_SECURE:-true}
      RSDP_ALLOWED_ORIGINS: ${RSDP_ALLOWED_ORIGINS:?Set RSDP_ALLOWED_ORIGINS in the server .env}
      RSDP_INITIAL_ADMIN_PASSWORD: ${RSDP_INITIAL_ADMIN_PASSWORD:-}
      RSDP_ORDER_INVITE_SECRET: ${RSDP_ORDER_INVITE_SECRET:?Set RSDP_ORDER_INVITE_SECRET in the server .env}
      RSDP_ORDER_INVITE_EXPIRE_DAYS: ${RSDP_ORDER_INVITE_EXPIRE_DAYS:-7}
      RSDP_IMPORT_ALLOWED_IMAGE_HOSTS: ${RSDP_IMPORT_ALLOWED_IMAGE_HOSTS:-}
      RSDP_AI_EXTENDED_CATEGORY_ENABLED: ${RSDP_AI_EXTENDED_CATEGORY_ENABLED:-false}
      RSDP_AI_EXTENDED_CATEGORY_SHADOW_ENABLED: ${RSDP_AI_EXTENDED_CATEGORY_SHADOW_ENABLED:-false}
      RSDP_AI_EXTENDED_CATEGORY_CODES: ${RSDP_AI_EXTENDED_CATEGORY_CODES:-DK,MT,MR,RG,PD,CW}
      RSDP_CAD_PARSER_BASE_URL: http://cad-parser:8090
    volumes:
      - ${RSDP_DATA_DIR:-/opt/rsdp/data}/server:/data
    healthcheck:
      # /api/v1/public/products 匿名可访问返回 200；wget 对非 2xx 退出码为 8
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8081/api/v1/public/products']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      cad-parser:
        condition: service_healthy

  web:
    build:
      context: ../web
    image: rsdp-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RSDP_WEB_PORT:-3101}:80"
    depends_on:
      server:
        condition: service_healthy
